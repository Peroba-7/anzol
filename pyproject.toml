# Configuração das ferramentas do projeto (as dependências ficam em requirements.txt)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: erros básicos, I: ordenação de imports, UP: sintaxe moderna, B: armadilhas comuns
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
